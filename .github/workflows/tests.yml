name: Tests

on: [push, pull_request]

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install build twine
      - name: Build both distributions
        run: |
          python -m build ./torchMWRT
          python -m build
      - run: python -m twine check --strict dist/* torchMWRT/dist/*
      - name: Check standalone torchMWRT
        run: |
          python -m pip install torchMWRT/dist/*.whl
          python - <<'PY'
          from importlib.util import find_spec

          import torch
          from torchMWRT import AtmProfile, RTModel

          assert find_spec('openMWR') is None
          profile = AtmProfile(
              height=torch.tensor([0., 1000., 2000.], dtype=torch.float64),
              temperature=torch.tensor([290., 283., 276.], dtype=torch.float64),
              pressure=torch.tensor([1010., 900., 800.], dtype=torch.float64),
              rh=torch.tensor([.6, .5, .4], dtype=torch.float64),
          )
          model = RTModel(freqs=[22.24, 58.0], angles=[90.0], absmdl='R24')
          result = model.execute(profile)['tbtotal']
          assert result.shape == (2, 1)
          assert torch.isfinite(result).all()
          PY
      - run: python -m pip install dist/*.whl
      - run: python -m pip install 'openMWR[test]'
      - run: python -m pytest --cov --cov-report=term --cov-report=json --durations=10
      - run: python -m pytest -m reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.json
