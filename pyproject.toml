[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openMWR"
version = "0.1"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "xarray",
    "torch",
    "matplotlib",
    "scikit-learn",
    "pyrtlib>=1.2.0",
    "pandas",
    "numpy",
    "scipy",
    "optuna",
    "cdsapi",
    "requests",
    "IPython",
    "ipykernel",
    "ipywidgets",
    "suntime",
    "metpy",
    "netCDF4",
    "pytest",
    "dask",
    "tomli-w",
]

[project.scripts]
openMWR = "openMWR.cli:main"

[project.optional-dependencies]
docs = [
    "sphinx>=8,<9",   # ensure compatibility with myst_nb 1.3
    "myst_nb>=1.3,<2",
    "sphinx_copybutton",
    "pydata_sphinx_theme",
    "sphinxcontrib-bibtex",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openMWR = ["evaluation.html", "templates/*.toml", "templates/site/*.toml", "templates/site/datasets/*.toml", "templates/site/retrieval/*/*.toml"]
