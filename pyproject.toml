[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openMWR"
version = "0.2.dev0"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "xarray",
    "torch",
    "matplotlib",
    "pyrtlib>=1.2.0",
    "pandas",
    "numpy",
    "scipy",
    "optuna",
    "cdsapi",
    "requests",
    "suntime",
    "metpy",
    "netCDF4",
    "mwrpy>=1.7.3,<1.8",
    "dask",
    "tomli-w",
]

[project.scripts]
openMWR = "openMWR.cli:main"

[project.optional-dependencies]
notebook = ["IPython", "ipykernel"]
test = ["pytest>=8", "pytest-cov>=7", "coverage>=7.10"]
docs = [
    "sphinx>=8,<9",   # ensure compatibility with myst_nb 1.3
    "myst_nb>=1.3,<2",
    "sphinx_copybutton",
    "pydata_sphinx_theme",
    "sphinxcontrib-bibtex",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openMWR = ["evaluation.html", "templates/*.toml", "templates/project.gitignore", "templates/site/*.toml", "templates/site/datasets/*.toml", "templates/site/retrieval/*/*.toml", "templates/site/evaluations/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not reference'"
markers = ["reference: compare fixed reference data with the installed external scientific implementation"]

[tool.coverage.run]
branch = true
source = ["openMWR", "torchMWRT"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
