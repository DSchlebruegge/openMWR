[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openMWR"
version = "0.2.2"
description = "Training and applying microwave radiometer retrievals"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "torchMWRT>=0.2.2",
    "xarray",
    "torch",
    "matplotlib",
    "pyrtlib>=1.2.0",
    "pandas",
    "numpy",
    "scipy",
    "optuna",
    "cdsapi",
    "requests",
    "suntime",
    "metpy",
    "netCDF4",
    "mwrpy>=1.7.3,<1.8",
    "dask",
    "tomli-w",
]

[project.urls]
Documentation = "https://dschlebruegge.github.io/openMWR/"
Source = "https://github.com/DSchlebruegge/openMWR"
Issues = "https://github.com/DSchlebruegge/openMWR/issues"
Changelog = "https://github.com/DSchlebruegge/openMWR/blob/main/CHANGELOG.md"

[project.scripts]
openMWR = "openMWR.cli:main"

[project.optional-dependencies]
notebook = ["IPython", "ipykernel"]
test = ["pytest>=8", "pytest-cov>=7", "coverage>=7.10"]
docs = [
    "sphinx>=8,<9",   # ensure compatibility with myst_nb 1.3
    "myst_nb>=1.3,<2",
    "sphinx_copybutton",
    "pydata_sphinx_theme",
    "sphinxcontrib-bibtex",
    "pybtex",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
openMWR = [
    "templates/*.html",
    "templates/**/*.toml",
    "templates/project.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not reference'"
markers = ["reference: compare fixed reference data with the installed external scientific implementation"]

[tool.coverage.run]
branch = true
source = ["openMWR", "torchMWRT"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
