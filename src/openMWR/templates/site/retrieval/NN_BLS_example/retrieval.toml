# Basic boundary-layer-scan NN with recommended settings written explicitly.
# Replace SITE with the site name: openMWR train SITE NN_BLS_example
schema_version = 1

[model]
kind = "nn"
output_vars = ["T", "rh", "lwc", "lwp", "iwv"]
mode = "bls"
frequencies = "dataset"
heights = "dataset"
angles = "dataset"
hidden_layers = [1024, 64, 1024]
dropout_rate = 0.1
additional_input_vars = ["surface_T", "surface_p", "surface_rh", "doy_cos", "doy_sin"]

[model.loss_weights]
# Height bounds in metres, inclusive.
T = { upper_bounds = [2000, 10000], values = [1.0, 0.5, 0.25] }
rh = { upper_bounds = [2000, 10000], values = [1.0, 0.5, 0.25] }
lwc = { upper_bounds = [2000, 10000], values = [1.0, 0.5, 0.25] }
lwp = 1.0
iwv = 1.0

[model.normalization]
TB = "z_norm"
surface_T = "z_norm"
surface_p = "z_norm"
surface_rh = "z_norm"
doy_cos = "std_norm"
doy_sin = "std_norm"
T = "z_norm"
rh = "z_norm"
lwc = "log_norm"
lwp = "log_norm"
iwv = "z_norm"

[data]
dataset = "training"
# Sources are inherited from the selected dataset; there is no date cutoff.

[training]
# Use an integer for repeatable training, or "random".
seed = 42
batch_size = 512
epochs = 500
learning_rate_max = 0.002
learning_rate_min = 1e-7
learning_rate_peak_epoch = 50
loss = "MAE"
weight_decay = 1e-5

[input_noise]
# Standard deviations in physical input units, before normalization.
# Angle dependence is off unless angle_dependence is specified.
method = "specified"
TB = 0.5  # K
surface_T = 0.5  # K
surface_p = 0.5  # hPa
surface_rh = 0.5  # percentage points
doy_cos = 0.2  # dimensionless
doy_sin = 0.2  # dimensionless
