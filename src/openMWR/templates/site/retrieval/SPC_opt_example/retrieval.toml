# Optimization example with explicit weight-decay and input-noise ranges.
# Replace SITE with the site name: openMWR train SITE SPC_opt_example
schema_version = 1

[model]
kind = "spectral"
mode = "zenith"
frequencies = "dataset"
hidden_layer_size = 64

[model.normalization]
TB = "z_norm"

[data]
dataset = "training"
# Sources are inherited from the selected dataset; there is no date cutoff.

[training]
# Use an integer for repeatable training, or "random".
seed = 42
batch_size = 512
epochs = 500
learning_rate_max = 0.002
learning_rate_min = 1e-7
learning_rate_peak_epoch = 50
loss = "MAE"
weight_decay = { low = 1e-8, high = 1e-4, log = true }

[input_noise]
# Standard deviations in physical input units, before normalization.
method = "specified"
TB = { low = 0.0, high = 1.5 }  # K

[optimization]
# Optional start_date/end_date (YYYY-MM-DD) combine with days_of_month.
# Both date bounds include the entire day.
seed = 42
days_of_month = { first = 1, last = 20 }
score_weights = { TB = 1.0 }
n_trials = 200
dataset = "analysis_radiosonde"
