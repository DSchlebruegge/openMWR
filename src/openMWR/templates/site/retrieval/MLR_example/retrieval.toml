# Basic zenith multilinear regression with recommended settings written explicitly.
# Replace SITE with the site name: openMWR train SITE MLR_example
schema_version = 1

[model]
kind = "mlr"
output_vars = ["T", "rh", "lwc", "lwp", "iwv"]
mode = "zenith"
frequencies = "dataset"
heights = "dataset"
additional_input_vars = ["TB_IR", "surface_T", "surface_p", "surface_rh", "doy_cos", "doy_sin"]

[model.normalization]
TB = "z_norm"
TB_IR = "z_norm"
surface_T = "z_norm"
surface_p = "z_norm"
surface_rh = "z_norm"
doy_cos = "std_norm"
doy_sin = "std_norm"
T = "z_norm"
rh = "z_norm"
lwc = "max_norm"
lwp = "max_norm"
iwv = "z_norm"

[data]
dataset = "training"
# Sources are inherited from the selected dataset; there is no date cutoff.

[training]
# Use an integer for repeatable training, or "random".
seed = 42

[input_noise]
# Standard deviations in physical input units, before normalization.
method = "specified"
TB = 0.5  # K
TB_IR = 0.5  # K
surface_T = 0.5  # K
surface_p = 0.5  # hPa
surface_rh = 0.5  # percentage points
doy_cos = 0.2  # dimensionless
doy_sin = 0.2  # dimensionless
