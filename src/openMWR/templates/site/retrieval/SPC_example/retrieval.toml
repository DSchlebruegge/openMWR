# Spectral consistency: predict each channel's TB from the other channels.
# Replace SITE with the site name: openMWR train SITE SPC_example
schema_version = 1

[model]
kind = "spectral"
mode = "zenith"
frequencies = "dataset"
hidden_layer_size = 64

[model.normalization]
TB = "z_norm"

[data]
dataset = "training"
# Sources are inherited from the selected dataset; there is no date cutoff.

[training]
# Use an integer for repeatable training, or "random".
seed = 42
batch_size = 512
epochs = 500
learning_rate_max = 0.002
learning_rate_min = 1e-7
learning_rate_peak_epoch = 50
loss = "MAE"
weight_decay = 1e-5

[input_noise]
# Standard deviations in physical input units, before normalization.
method = "specified"
TB = 0.5  # K
